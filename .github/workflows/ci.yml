name: Tests and Debian build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            python3 python3-gi python3-cairo python3-gi-cairo \
            gir1.2-gtk-3.0 gir1.2-secret-1 dbus xvfb xauth dpkg-dev

      # Failures are also written as annotations, so they are readable without the log view.
      - name: Hardware-free unit tests
        run: |
          set -o pipefail
          /usr/bin/python3 -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee unit.log || {
            grep -E -A12 '^(FAIL|ERROR):' unit.log | head -60 | sed 's/^/::error title=Unit tests::/'; exit 1; }

      - name: Headless native GUI tests
        run: |
          set -o pipefail
          for test in tests/gui_smoke.py tests/audio_gui_smoke.py; do
            dbus-run-session -- xvfb-run -a /usr/bin/python3 "$test" 2>&1 | tee gui.log || {
              grep -E -A14 '^(FAIL|ERROR):|Traceback' gui.log | head -80 | sed "s|^|::error title=$test::|"; exit 1; }
          done

      - name: Build Debian package
        run: /usr/bin/python3 scripts/build_deb.py
